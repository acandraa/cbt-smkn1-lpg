<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Peserta - CBT SMK Negeri 1 Lempuing</title>
  <meta name="description" content="Portal Login Peserta Ujian CBT Online SMK Negeri 1 Lempuing.">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-card-container {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>

<body class="bg-light">

  <div class="login-wrapper">
    <div class="login-card-container">

      <!-- Main Login Glass Card -->
      <div class="glass-card p-4 p-md-5 shadow-sm border-0 rounded-4 bg-white">

        <!-- School Logo & Header -->
        <div class="text-center mb-4">
          <svg width="65" height="65" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-3">
            <circle cx="50" cy="50" r="45" fill="#0d6efd" stroke="#ffffff" stroke-width="4" />
            <path d="M50 20 L25 40 L35 40 L35 75 L65 75 L65 40 L75 40 Z" fill="#ffffff" />
            <circle cx="50" cy="50" r="8" fill="#ffc107" />
          </svg>
          <h4 class="fw-bold mb-1" style="color: #1e3c72;">CBT SMKN 1 Lempuing</h4>
          <p class="text-muted small mb-0">Portal Login Peserta Ujian CBT</p>
        </div>

        <!-- Form Login Peserta -->
        <form id="form-peserta" autocomplete="off">
          <div class="mb-3">
            <label for="peserta-username" class="form-label font-heading fw-semibold small text-muted">Nomor Peserta /
              Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="peserta-username"
                placeholder="Masukkan nomor peserta" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
            </div>
          </div>
          <div class="mb-4">
            <label for="peserta-password" class="form-label font-heading fw-semibold small text-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="peserta-password"
                placeholder="Masukkan password" required autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
              <button class="btn btn-outline-secondary border-start-0" type="button"
                onclick="togglePassword('peserta-password')">
                <i class="bi bi-eye" id="peserta-password-eye"></i>
              </button>
            </div>
          </div>
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary-custom text-white py-2 rounded-3 fw-semibold shadow-sm"
              id="btn-login-peserta">
              Masuk Ujian <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>
          </div>
        </form>

      

      </div>

      <!-- Footer Info -->
      <div class="text-center mt-3 text-muted small">
        &copy; CBT SMK Negeri 1 Lempuing
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=90"></script>
  <script src="js/supabase-config.js?v=90"></script>
  <script src="js/db-adapter.js?v=90"></script>
  <script src="js/auth.js?v=90"></script>

  <script>
    // Toggle Password Visibility
    function togglePassword(id) {
      const field = document.getElementById(id);
      const eye = document.getElementById(id + '-eye');
      if (field.type === 'password') {
        field.type = 'text';
        eye.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        field.type = 'password';
        eye.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }

    async function handleMultiDeviceTakeoverModal(num, pass, err) {
      const result = await Swal.fire({
        icon: 'warning',
        title: 'Akun Sedang Aktif di HP Lain',
        html: `
          <div class="text-start small">
            <p class="mb-2">${err.message || 'Akun ini sedang digunakan di perangkat lain.'}</p>
            <div class="alert alert-light border py-2 px-3 mb-3">
              <strong>Ingin pindah ke HP ini (HP lama mati/error)?</strong><br>
              Minta <strong>Token Pembebas</strong> dari Pengawas lalu ketik di bawah ini, atau minta Pengawas klik <em>Reset Login</em> di panel Monitoring.
            </div>
          </div>
        `,
        input: 'text',
        inputPlaceholder: 'Masukkan Token Pembebas dari Pengawas...',
        inputAttributes: {
          autocapitalize: 'characters',
          autocomplete: 'off',
          style: 'text-align: center; font-weight: bold; letter-spacing: 3px; text-transform: uppercase;'
        },
        showCancelButton: true,
        confirmButtonText: '<i class="bi bi-phone-flip me-1"></i> Pindah ke HP Ini',
        cancelButtonText: 'Tutup',
        confirmButtonColor: '#0d6efd',
        cancelButtonColor: '#6c757d',
        preConfirm: async (val) => {
          const cleanToken = String(val || '').trim().toUpperCase();
          if (!cleanToken) {
            Swal.showValidationMessage('Masukkan Token Pembebas dari Pengawas terlebih dahulu.');
            return false;
          }
          let settings = null;
          try {
            if (typeof DB.getSettings === 'function') {
              settings = await DB.getSettings();
            }
          } catch (e) {}
          const valid = typeof DB.isValidExamToken === 'function'
            ? DB.isValidExamToken(cleanToken, settings)
            : false;
          if (!valid) {
            Swal.showValidationMessage('Token Pembebas tidak valid atau sudah kadaluarsa. Cek kembali token terbaru di layar Pengawas.');
            return false;
          }
          return cleanToken;
        }
      });

      if (result.isConfirmed && result.value) {
        Swal.fire({
          title: 'Memindahkan Sesi ke HP Ini...',
          allowOutsideClick: false,
          didOpen: () => { Swal.showLoading(); }
        });
        try {
          const data = await DB.loginPeserta(num, pass, { forceTakeover: true, takeoverToken: result.value });
          Swal.fire({
            icon: 'success',
            title: 'Berhasil Pindah Perangkat!',
            text: `Selamat datang kembali, ${data.profile.nama_lengkap}! Perangkat lama telah dikeluarkan secara otomatis.`,
            timer: 1800,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'ujian.html?v=90';
          });
          return true;
        } catch (takeoverErr) {
          Swal.fire('Gagal Pindah Perangkat', takeoverErr.message || 'Silakan coba lagi atau hubungi Pengawas.', 'error');
        }
      }
      return false;
    }

    function escapeHtmlLogin(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Handle Peserta Login (dilengkapi Konfirmasi Identitas agar siswa tidak salah masuk akun teman saat salah ketik nomor!)
    document.getElementById('form-peserta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const num = document.getElementById('peserta-username').value.trim();
      const pass = document.getElementById('peserta-password').value.trim();
      const btn = document.getElementById('btn-login-peserta');

      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Memproses...`;
      btn.disabled = true;

      try {
        const data = await DB.loginPeserta(num, pass);
        const prof = (data && data.profile) || {};
        const stLabel = prof.status_ujian === 'Sudah Ujian'
          ? '<span class="badge bg-warning text-dark">Sudah Pernah Submit Ujian</span>'
          : prof.status_ujian === 'Sedang Ujian'
            ? '<span class="badge bg-info text-dark">Melanjutkan Ujian</span>'
            : '<span class="badge bg-success">Siap Mulai Ujian</span>';

        const confirmIdentity = await Swal.fire({
          icon: 'question',
          title: 'Pastikan Ini Nama Anda',
          html: `
            <div class="p-3 rounded-3 border bg-light text-start small">
              <div class="text-muted mb-1">Nama Lengkap Peserta:</div>
              <div class="fs-5 fw-bold text-primary mb-2">${escapeHtmlLogin(prof.nama_lengkap || '-')}</div>
              <div class="d-flex flex-wrap gap-2 align-items-center">
                <span class="badge bg-dark font-monospace">No: ${escapeHtmlLogin(prof.username || num)}</span>
                <span class="badge bg-secondary">${escapeHtmlLogin(prof.kelas || '-')}</span>
                ${stLabel}
              </div>
            </div>
            <div class="small text-muted mt-2">Jika bukan nama Anda, klik <strong>Bukan Saya</strong> untuk memperbaiki Nomor Peserta.</div>
          `,
          showCancelButton: true,
          confirmButtonColor: '#0d6efd',
          cancelButtonColor: '#dc3545',
          confirmButtonText: '<i class="bi bi-check-circle-fill me-1"></i> Benar, Ini Saya',
          cancelButtonText: 'Bukan Saya (Salah Nomor)',
          allowOutsideClick: false,
          reverseButtons: true
        });

        if (!confirmIdentity.isConfirmed) {
          // Lepas kembali sesi tanpa mengalihkan ke ujian.html agar akun teman tidak terkunci!
          try {
            if (typeof DB.setPesertaSessionToken === 'function' && prof.id) {
              await DB.setPesertaSessionToken(prof.id, null);
            }
            if (typeof Auth !== 'undefined' && Auth.clearSessionData) {
              Auth.clearSessionData();
            }
          } catch (e2) {}
          btn.innerHTML = `Masuk Ujian <i class="bi bi-box-arrow-in-right ms-1"></i>`;
          btn.disabled = false;
          document.getElementById('peserta-username').select();
          return;
        }

        window.location.href = 'ujian.html?v=90';
      } catch (err) {
        if (err && err.code === 'MULTI_DEVICE_ACTIVE') {
          const moved = await handleMultiDeviceTakeoverModal(num, pass, err);
          if (!moved) {
            btn.innerHTML = `Masuk Ujian <i class="bi bi-box-arrow-in-right ms-1"></i>`;
            btn.disabled = false;
          }
          return;
        }
        Swal.fire('Login Gagal', err.message || 'Username atau password salah.', 'error');
        btn.innerHTML = `Masuk Ujian <i class="bi bi-box-arrow-in-right ms-1"></i>`;
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
